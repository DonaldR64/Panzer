<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="display"  />
<div>
    <button type="action" name="act_input">Input</button>
    <button type="action" name="act_basic">Basic</button>
</div>

<div class="sheet-input">
    <div class="2colrow">
        <div class="col">
            <h3>Information</h3>
            <label>Name:</label><input type="text" name="attr_character_name">
            <br>
            <label for="attr_type">Type:</label>
            <select name="attr_type">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Infantry">Infantry</option>

                <option value="System Token">System Token</option>
            </select>
            <br>            
            <label for="attr_nation">Nation:</label>
            <select name="attr_nation">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="USA">USA</option>
                <option value="Soviet">Soviet Union</option>
                <option value="Neutral">Neutral</option>
            </select>
        </div>
        <div class="col">
            <label>Armour:</label><input type="text" name="attr_armour">
            <label>GP Defense:</label><input type="text" name="attr_gpd">
            <label>CC Move (MP):</label><input type="number" name="attr_move">
            <label for="attr_movetype">Move Type:</label>
            <select name="attr_movetype">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="T">Tracked</option>
                <option value="H">Half-Track</option>
                <option value="W">Wheeled</option>
                <option value="L">Leg</option>

            </select>
            <label>Path Move:</label><input type="number" name="attr_pathmove">
            <label>Road Move:</label><input type="number" name="attr_roadmove">
            <label>Size:</label><input type="number" name="attr_size">
        </div>



    </div>    




    <div class="row">
        <h3>Weapon 1</h3>
        <td><input type="text" name="attr_weapon1name"></td>
        <td><input type="text" name="attr_weapon1stab"></td>
        <td><input type="text" name="attr_weapon1sight"></td>
        <label for="attr_weapon1turret">Turret:</label>
        <select name="attr_weapon1turret">
            <option value="" selected disabled hidden>Choose here</option>
            <option value="Turret">Turret</option>
            <option value="No Turret">No Turret</option>
            <option value="360°">360°</option>
        </select>

        <table>
            <thead>
                <tr>
                    <th> </th>
                    <th>P</th>
                    <th>S</th>
                    <th>M</th>
                    <th>L</th>
                    <th>E</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Range</td>
                    <td><input type="number" name="attr_w1rangeP"></td>
                    <td><input type="number" name="attr_w1rangeS"></td>
                    <td><input type="number" name="attr_w1rangeM"></td>
                    <td><input type="number" name="attr_w1rangeL"></td>
                    <td><input type="number" name="attr_w1rangeE"></td>
                </tr>
                <tr>
                    <td>Pen</td>
                    <td><input type="number" name="attr_w1penP"></td>
                    <td><input type="number" name="attr_w1penS"></td>
                    <td><input type="number" name="attr_w1penM"></td>
                    <td><input type="number" name="attr_w1penL"></td>
                    <td><input type="number" name="attr_w1penE"></td>
                </tr>
            </tbody>
        </table>    
   
        



    </div>
</div>


<div class="sheet-display">
    <input type="hidden" name="attr_nation"/>
    <div class="mysheet">
        <div class="attributes">
            <main>
                <section class="header f-center">
                    <h1><span name="attr_character_name"></span></h1>
                    <h3><span name="attr_nation"></span> <span name="attr_type"></span></h3>
                </section>

                <section class="armour f-center">
                    <h3>Front Armour: <span name="attr_armourF"></span></h3>
                    <h3>Rear Armour: <span name="attr_armourR"></span></h3>
                    <h3>Size: <span name="attr_size"></span></h3>
                </section>

                <section class="move f-center">
                    <h3>Cross-Country: <span name="attr_move"></span><span name="attr_movetype"></span></h3>
                    <h3>Path/Road: <span name="attr_movedisplay"></span></h3>
                </section>



                <section class="common">
                    <div>
                        <img alt="Character Avatar" name="attr_character_avatar" style="width:auto;height:250px; bottom: 0;"/>
                    </div>
                </section>

                <section class="weapon">    



                </section>
            </main>
        </div>
    </div>    
</div>








<script type="text/worker">
    const buttonlist = ["input","basic"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"basic"});
    });


    on("sheet:opened", function() {
        getAttrs(["pathmove","roadmove"], function(values) {

            let pm = parseInt(values.pathmove);
            let rm = parseInt(values.roadmove);
            let md = pm;
            if (pm !== rm) {
                md += "/" + rm;
            }

            setAttrs({
                "movedisplay": md,
                
            }); 
        });
    });




</script>
