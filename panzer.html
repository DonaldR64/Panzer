<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="display"  />
<div>
    <button type="action" name="act_input">Input</button>
    <button type="action" name="act_basic">Basic</button>
</div>

<div class="sheet-input">
    <div class="2colrow">
        <div class="col">
            <h3>Information</h3>
            <label>Name:</label><input type="text" name="attr_character_name">
            <br>
            <label for="attr_type">Type:</label>
            <select name="attr_type">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Tank">Tank</option>
                <option value="System Token">System Token</option>
            </select>
            <br>            
            <label for="attr_nation">Nation:</label>
            <select name="attr_nation">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Germany">Germany</option>
                <option value="Soviet">Soviet Union</option>
                <option value="Neutral">Neutral</option>
            </select>
        </div>
        <div class="col">
            <label>Armour Front:</label><input type="number" name="attr_armourF">
            <label>Armour Rear:</label><input type="number" name="attr_armourR">
            <label>CC Move (MP):</label><input type="number" name="attr_move">
            <label for="attr_movetype">Move Type:</label>
            <select name="attr_movetype">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="T">Tracked</option>
                <option value="H">Half-Track</option>
                <option value="W">Wheeled</option>
            </select>
            <label>Path Move:</label><input type="number" name="attr_pathmove">
            <label>Road Move:</label><input type="number" name="attr_roadmove">
            <label>Size:</label><input type="number" name="attr_size">
            <label for="attr_turret">Turret:</label>
            <select name="attr_turret">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Turret">Turret</option>
                <option value="No Turret">No Turret</option>
                <option value="360°">360°</option>
            </select>
        </div>



    </div>    




    <div class="row">
        <h3>Weapons</h3>
        <td><input type="text" name="attr_weaponname"></td>
        <div class="weapons">
            <table>
                <thead>
                    <tr>
                        <th> </th>
                        <th>P</th>
                        <th>S</th>
                        <th>M</th>
                        <th>L</th>
                        <th>E</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Range</td>
                        <td><input type="number" name="attr_type1rangeP"></td>
                        <td><input type="number" name="attr_type1rangeS"></td>
                        <td><input type="number" name="attr_type1rangeM"></td>
                        <td><input type="number" name="attr_type1rangeL"></td>
                        <td><input type="number" name="attr_type1rangeE"></td>
                    </tr>
                    <tr>
                        <td>Pen</td>
                        <td><input type="number" name="attr_type1penP"></td>
                        <td><input type="number" name="attr_type1penS"></td>
                        <td><input type="number" name="attr_type1penM"></td>
                        <td><input type="number" name="attr_type1penL"></td>
                        <td><input type="number" name="attr_type1penE"></td>
                    </tr>
                </tbody>
            </table>    
        </div>   
    </div>
</div>


<div class="sheet-display">
    <input type="hidden" name="attr_nation"/>
    <div class="mysheet">
        <div class="attributes">
            <main>
                <section class="header f-center">
                    <h1><span name="attr_character_name"></span></h1>
                    <h3><span name="attr_nation"></span> <span name="attr_type"></span></h3>
                </section>

                <section class="armour f-center">
                    <h3>Front Armour: <span name="attr_armourF"></span></h3>
                    <h3>Rear Armour: <span name="attr_armourR"></span></h3>
                    <h3>Size: <span name="attr_size"></span>, <span name="attr_turret"></span></h3>
                </section>

                <section class="move f-center">
                    <h3>Cross-Country: <span name="attr_move"></span><span name="attr_movetype"></span></h3>
                    <h3>Path/Road: <span name="attr_movedisplay"></span></h3>
                </section>



                <section class="common">
                    <div>
                        <img alt="Character Avatar" name="attr_character_avatar" style="width:auto;height:270px; bottom: 0;"/>
                    </div>
                </section>

                <section class="weapon">    
                    <h3><span name="attr_weaponname"></span></h3>
                    <div class="topline">
                        <span> </span>    
                        <h4>Point Blank</h4>    
                        <h4>Short</h4>    
                        <h4>Medium</h4>    
                        <h4>Long</h4>
                        <h4>Extreme</h4>
                    </div>        
                    <div class="midline">
                        <h4>Range</h4>    
                        <span name="attr_type1rangeP"></span>    
                        <span name="attr_type1rangeS"></span>    
                        <span name="attr_type1rangeM"></span>    
                        <span name="attr_type1rangeL"></span>    
                        <span name="attr_type1rangeE"></span>    
                    </div>   
                    <div class="botline">
                        <h4>Pen</h4>    
                        <span name="attr_type1penP"></span>    
                        <span name="attr_type1penS"></span>    
                        <span name="attr_type1penM"></span>    
                        <span name="attr_type1penL"></span>    
                        <span name="attr_type1penE"></span>  
                    </div>   



                </section>
            </main>
        </div>
    </div>    
</div>








<script type="text/worker">
    const buttonlist = ["input","basic"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"basic"});
    });


    on("sheet:opened", function() {
        getAttrs(["pathmove","roadmove"], function(values) {

            let pm = parseInt(values.pathmove);
            let rm = parseInt(values.roadmove);
            let md = pm;
            if (pm !== rm) {
                md += "/" + rm;
            }

            setAttrs({
                "movedisplay": md,
                
            }); 
        });
    });




</script>
